name: Teste Automate Enterprise ERP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Aceasta linie iti permite sa dai "Run workflow" manual oricand doresti

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install all dependencies with uv
      run: |
        uv sync
        npm install -g promptfoo

    - name: Run Pytest
      run: |
        uv run pytest

    - name: Run Promptfoo Evaluation
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} 
      run: |
        if [ -f promptfoo.yaml ] || [ -f promptfoo.config.yaml ]; then 
          uv run promptfoo eval || echo "Promptfoo are nevoie de configurare completa a prompturilor. Trecem mai departe."
        else 
          echo "Nu s-a gasit configurare Promptfoo inca."
        fi
