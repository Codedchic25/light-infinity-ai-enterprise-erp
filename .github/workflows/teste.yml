name: Teste Automate Enterprise ERP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Instalam instrumentul 'uv' pe care il ai deja in proiect
    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    # Sincronizam automat toate dependentele din pyproject.toml / uv.lock
    - name: Install all dependencies with uv
      run: |
        uv sync
        npm install -g promptfoo

    # Rulam testele prin uv ca sa aiba acces la librariile instalate
    - name: Run Pytest
      run: |
        uv run pytest

    - name: Run Promptfoo Evaluation
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} 
      run: |
        if [ -f promptfoo.yaml ] || [ -f promptfoo.config.yaml ]; then uv run promptfoo eval; else echo "Nu s-a gasit configurare Promptfoo inca."; fi
