name: Teste Automate Enterprise ERP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Instalam pytest direct ca sa fim siguri ca exista in sistem
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        npm install -g promptfoo

    - name: Run Pytest
      run: |
        if [ -d "tests" ] || ls test_*.py 1> /dev/null 2>&1; then pytest; else echo "Nu s-au gasit teste Pytest inca."; fi

    - name: Run Promptfoo Evaluation
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} 
      run: |
        if [ -f promptfooconfig.yaml ] || [ -f promptfoo.config.yaml ]; then promptfoo eval; else echo "Nu s-a gasit configurare Promptfoo inca."; fi
